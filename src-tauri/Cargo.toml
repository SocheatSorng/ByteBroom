[package]
name = "bytebroom-app"
description = "ByteBroom's window: Tauri commands over bytebroom-core, and nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "bytebroom_app"

[[bin]]
name = "bytebroom"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytebroom-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
# Owner's decision 4: the native folder dialog, used from Rust only (no page permission).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
