[package]
name = "bytebroom-core"
description = "ByteBroom's safety core: path policy, delete engine, scanner and tier rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Restore", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1.12.0"
