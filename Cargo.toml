[workspace]
resolver = "3"
members = ["crates/core", "crates/scan", "crates/admin", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/SocheatSorng/ByteBroom"
publish = false

[workspace.lints.rust]
# Unsafe Win32 calls are allowed only in crates/core/src/win/ (it opts in with #[allow(unsafe_code)]).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
