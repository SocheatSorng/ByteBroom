# cargo-deny: known vulnerabilities, licenses and crate sources. Run: cargo deny check
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Any RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
yanked = "deny"
unmaintained = "all"

[licenses]
# Permissive licenses that are compatible with ByteBroom's MIT license.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# MPL-2.0 (file-level copyleft: using these unmodified is fine under MIT) only for the crates Tauri
# needs: the CSS/HTML parser tauri-utils uses for the CSP, and `dirs`' helper. No other crate may
# bring MPL-2.0 in without a review.
exceptions = [
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
]
# The list is kept ready for the Tauri app (phase 3); don't warn about entries no crate uses yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The scan tool depends on the core crate by path, inside this repo; neither is published. Wildcard
# versions from crates.io stay denied.
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
