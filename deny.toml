# cargo-deny: known vulnerabilities, licenses and crate sources. Run: cargo deny check
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Any RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
yanked = "deny"
unmaintained = "all"

[licenses]
# Permissive licenses that are compatible with ByteBroom's MIT license.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list is kept ready for the Tauri app (phase 3); don't warn about entries no crate uses yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io; no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
