# Install once:  uv tool install pre-commit   (or: pip install pre-commit)
# Then:          pre-commit install           (runs on every commit)
# Refresh pins:  pre-commit autoupdate
# The linter, code security scanner and tests are added as local hooks once the toolchain is chosen.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.33.1
    hooks:
      - id: zizmor
