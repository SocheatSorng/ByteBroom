# Install once:  uv tool install pre-commit   (or: pip install pre-commit)
# Then:          pre-commit install           (runs on every commit)
# Refresh pins:  pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.33.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # rustfmt + clippy (the code scanner: -D warnings, unsafe only in crates/core/src/win/).
      # CodeQL in CI scans the Rust too.
      - id: cargo-fmt
        name: cargo fmt (format check)
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-clippy
        name: cargo clippy (lint + code security rules)
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: \.(rs|toml)$

      - id: cargo-test
        name: cargo test (includes the safety and docs-drift tests)
        entry: cargo test --workspace
        language: system
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny (vulnerabilities, licenses, sources)
        entry: cargo deny check
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|deny\.toml|crates/.*/Cargo\.toml)$
