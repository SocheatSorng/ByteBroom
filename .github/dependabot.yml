version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date (Dependabot updates the
  # SHA and the "# vX.Y.Z" comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Rust crates (Cargo.lock). Each update still has to pass cargo deny and the tests.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]
