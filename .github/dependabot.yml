version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date (Dependabot updates the
  # SHA and the "# vX.Y.Z" comment together).
  # The app's own package ecosystem is added once the toolchain is chosen.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
